[project]
name = "kavalan"
version = "0.1.0"
description = "Kavalan — voice guardian for elderly parents. AI agent governed by ArmorIQ."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0,<2",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "armoriq-sdk>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "approval", "mcp_servers", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
